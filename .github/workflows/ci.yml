name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|perf|refactor|docs|test|build|ci|chore)(\([a-z0-9._/-]+\))?(!)?:[[:space:]].+ ]]; then
            echo "PR title must follow Conventional Commits, for example: feat: add checkout"
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@artenanagara'

      - name: Install dependencies
        run: npm ci
        env:
          # GITHUB_TOKEN is scoped to this repo only and cannot read
          # packages published by zenko-design-system, a different repo —
          # PACKAGES_READ_TOKEN is a PAT with read:packages + repo scope.
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
