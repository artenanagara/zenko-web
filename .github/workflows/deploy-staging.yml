name: Deploy (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_SHA: ${{ github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check out revision
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@artenanagara'

      - name: Install dependencies
        run: npm ci
        env:
          # GITHUB_TOKEN is scoped to this repo only and cannot read
          # packages published by zenko-design-system, a different repo —
          # PACKAGES_READ_TOKEN is a PAT with read:packages + repo scope.
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Build production server
        run: npm run build

      - name: Package release
        run: tar -czf "/tmp/zenko-web-staging-${DEPLOY_SHA}.tar.gz" -C .output .

      - name: Configure SSH
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/zenko-deploy
          chmod 0600 ~/.ssh/zenko-deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and activate release
        run: |
          archive="/tmp/zenko-web-staging-${DEPLOY_SHA}.tar.gz"
          remote_archive="/tmp/zenko-web-staging-${DEPLOY_SHA}.tar.gz"
          scp -i ~/.ssh/zenko-deploy -o IdentitiesOnly=yes "$archive" "$VPS_USER@$VPS_HOST:$remote_archive"
          ssh -i ~/.ssh/zenko-deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            sudo -n /usr/local/sbin/zenko-deploy-web-staging "$DEPLOY_SHA" "$remote_archive"
