name: Deploy (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Upload to the VPS has been seen to sit for 20+ minutes on a dead SSH
    # session; the keep-alive options below fail that fast, and this bounds
    # everything else.
    timeout-minutes: 20
    environment: staging
    env:
      DEPLOY_SHA: ${{ github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check out revision
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@artenanagara'

      - name: Install dependencies
        run: npm ci
        env:
          # GITHUB_TOKEN is scoped to this repo only and cannot read
          # packages published by zenko-design-system, a different repo —
          # PACKAGES_READ_TOKEN is a PAT with read:packages + repo scope.
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Build production server
        run: npm run build

      - name: Package release
        run: tar -czf "/tmp/zenko-web-staging-${DEPLOY_SHA}.tar.gz" -C .output .

      - name: Configure SSH
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/zenko-deploy
          chmod 0600 ~/.ssh/zenko-deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and activate release
        run: |
          archive="/tmp/zenko-web-staging-${DEPLOY_SHA}.tar.gz"
          remote_archive="/tmp/zenko-web-staging-${DEPLOY_SHA}.tar.gz"
          # One SSH session can crawl at a few KB/s while a fresh one to the same
          # host flies (a 9 MB upload has taken 18 minutes), so a transfer that
          # has not finished in five minutes is abandoned and started over.
          for attempt in 1 2 3; do
            if timeout 300 scp -i ~/.ssh/zenko-deploy -o IdentitiesOnly=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$archive" "$VPS_USER@$VPS_HOST:$remote_archive"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "upload failed after 3 attempts" >&2
              exit 1
            fi
            echo "upload attempt $attempt stalled; retrying" >&2
            sleep 10
          done
          ssh -i ~/.ssh/zenko-deploy -o IdentitiesOnly=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$VPS_USER@$VPS_HOST" \
            sudo -n /usr/local/sbin/zenko-deploy-web-staging "$DEPLOY_SHA" "$remote_archive"
