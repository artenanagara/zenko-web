name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check out successful revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production server
        run: npm run build

      - name: Package release
        run: tar -czf "/tmp/zenko-web-${DEPLOY_SHA}.tar.gz" -C .output .

      - name: Configure SSH
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/zenko-deploy
          chmod 0600 ~/.ssh/zenko-deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and activate release
        run: |
          archive="/tmp/zenko-web-${DEPLOY_SHA}.tar.gz"
          remote_archive="/tmp/zenko-web-${DEPLOY_SHA}.tar.gz"
          scp -i ~/.ssh/zenko-deploy -o IdentitiesOnly=yes "$archive" "$VPS_USER@$VPS_HOST:$remote_archive"
          ssh -i ~/.ssh/zenko-deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            sudo -n /usr/local/sbin/zenko-deploy-web "$DEPLOY_SHA" "$remote_archive"
