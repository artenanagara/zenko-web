name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deliver:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@artenanagara'

      - name: Install dependencies
        run: npm ci
        env:
          # GITHUB_TOKEN is scoped to this repo only and cannot read
          # packages published by zenko-design-system, a different repo —
          # PACKAGES_READ_TOKEN is a PAT with read:packages + repo scope.
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Verify release version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: test "$(npm run --silent version:show)" = "$VERSION"

      - name: Typecheck
        run: npm run typecheck

      # The bundle below archives .output, which only exists once Nuxt has
      # built. Without this the tar step fails on a missing directory.
      - name: Build
        run: npm run build

      - name: Build release bundle
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/zenko-web-v${VERSION}.tar.gz" .output
          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber
